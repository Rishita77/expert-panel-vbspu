<form method="get" class="office-card report-filters">
  <div><label for="year">नामांकन वर्ष</label><select id="year" name="year">{% for item in filters.years %}<option value="{{ item }}" {% if item == filters.year %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div>
  <div><label for="college">महाविद्यालय</label><select id="college" name="college"><option value="">सभी</option>{% for item in filters.colleges %}<option value="{{ item.pk }}" {% if filters.college == item.pk|stringformat:'s' %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></div>
  <div><label for="subject">विषय</label><select id="subject" name="subject"><option value="">सभी</option>{% for item in filters.subjects %}<option value="{{ item.pk }}" {% if filters.subject == item.pk|stringformat:'s' %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></div>
  <div><label for="role">भूमिका</label><select id="role" name="role"><option value="">सभी</option><option value="vc" {% if filters.role == 'vc' %}selected{% endif %}>कुलपति नामित</option><option value="principal" {% if filters.role == 'principal' %}selected{% endif %}>प्राचार्य</option><option value="professor" {% if filters.role == 'professor' %}selected{% endif %}>प्रोफेसर</option><option value="scst" {% if filters.role == 'scst' %}selected{% endif %}>अतिरिक्त SC/ST</option><option value="obc" {% if filters.role == 'obc' %}selected{% endif %}>अतिरिक्त OBC</option></select></div>
  <div><label for="category">श्रेणी</label><select id="category" name="category"><option value="">सभी</option><option value="general" {% if filters.category == 'general' %}selected{% endif %}>सामान्य</option><option value="obc" {% if filters.category == 'obc' %}selected{% endif %}>OBC</option><option value="sc" {% if filters.category == 'sc' %}selected{% endif %}>SC</option><option value="st" {% if filters.category == 'st' %}selected{% endif %}>ST</option></select></div>
  <button class="btn btn-primary">रिपोर्ट देखें</button>
</form>
