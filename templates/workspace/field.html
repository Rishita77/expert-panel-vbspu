{% load i18n %}<div class="{% if field.name == 'remarks' %}col-12{% else %}col-md-6{% endif %}"><label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div id="{{ field.id_for_label }}_helptext" class="form-text">{{ field.help_text }}</div>{% endif %}{% if field.errors %}<div class="field-errors">{{ field.errors }}</div>{% endif %}</div>
